name: Windows programı

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Programı derle
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: BasinMasasi-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Sürüm numarası
        id: surum
        shell: bash
        run: echo "surum=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # İndirme sayfası. latest.yml ve .blockmap, programın otomatik güncellemesi içindir.
      # Yeni sürüm yayımlamak için package.json'daki "version" yükseltilir; aynı sürüm
      # yeniden derlenirse mevcut sürümün dosyaları yenilenir.
      - name: İndirme sayfasını güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.surum }}
          name: Basın Masası ${{ steps.surum.outputs.surum }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **İlk kurulum:** `BasinMasasi-Kurulum-${{ steps.surum.outputs.surum }}.exe` dosyasını indirip çalıştırın; masaüstüne kısayol eklenir.
            Kurulumdan sonra program **kendini otomatik günceller**; yeniden indirmeniz gerekmez.

            **Kurulumsuz:** `BasinMasasi-Tasinabilir-….exe` kurulum gerektirmez ama otomatik güncellenmez.

            Windows "bilinmeyen yayımcı" uyarısı verirse: **Ek bilgi → Yine de çalıştır**.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
