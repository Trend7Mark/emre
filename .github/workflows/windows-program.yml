name: Windows programı

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Programı derle
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: BasinMasasi-Windows
          path: dist/*.exe
          if-no-files-found: error

      # Her derleme, indirme sayfasında "son sürüm" olarak yayımlanır.
      - name: İndirme sayfasını güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Basın Masası (derleme ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Kurulum:** `BasinMasasi-Kurulum-...exe` dosyasını indirip çalıştırın; masaüstüne kısayol eklenir.
            **Kurulumsuz:** `BasinMasasi-Tasinabilir-...exe` dosyası kurulum gerektirmeden doğrudan açılır.

            Windows "bilinmeyen yayımcı" uyarısı verirse: **Ek bilgi → Yine de çalıştır**.
          files: dist/*.exe
